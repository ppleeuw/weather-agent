<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Weather Agent</title>
  <!-- Speech bubble: rounded outline with a short tail bottom-left, filled with the page
       colour so the mark also reads on a dark browser tab bar -->
  <path d="M10 2 H22 A8 8 0 0 1 30 10 V18 A8 8 0 0 1 22 26 H15 L6 31 L10 26 A8 8 0 0 1 2 18 V10 A8 8 0 0 1 10 2 Z"
        fill="#fbfbf8" stroke="#18181b" stroke-width="2" stroke-linejoin="round"/>
  <!-- Sun: eight short rays, the same four drawn twice with a 45 degree turn, then the disc on top -->
  <g stroke="#fec63a" stroke-width="1.5" stroke-linecap="round">
    <path d="M16 6 V4.75 M16 22 V23.25 M8 14 H6.75 M24 14 H25.25"/>
    <path d="M16 6 V4.75 M16 22 V23.25 M8 14 H6.75 M24 14 H25.25" transform="rotate(45 16 14)"/>
  </g>
  <circle cx="16" cy="14" r="6" fill="#fa500f"/>
</svg>
