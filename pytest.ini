[pytest]
# The package is imported from the project root, without installing it.
pythonpath = .
testpaths = tests
# Starlette's TestClient warns about httpx versus httpx2; the client works and
# the warning is not about our code.
filterwarnings =
    ignore:Using .httpx. with .starlette.testclient.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
